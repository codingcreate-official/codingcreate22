<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodingCreate</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14204d;
    --text: #2b3350;
    --muted: #6b7394;
    --bg: #ffffff;
    --card: #ffffff;
    --border: #e6e9f5;
    --accent1: #ff9f1c;
    --accent2: #ff2d87;
    --accent3: #7b3fff;
    --accent4: #1f8fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 100% 0%, rgba(255,45,135,.08), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(31,143,255,.08), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  .logo {
    width: 220px;
    height: 220px;
    max-width: 60vw;
    max-height: 60vw;
    object-fit: contain;
    margin: 0 auto 28px;
    display: block;
  }
  .logo-fallback {
    display: none;
    position: relative;
    width: 260px;
    max-width: 70vw;
    aspect-ratio: 1;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: #fff;
    direction: ltr;
  }
  .logo-fallback .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff6a3d 0deg, #ff2d87 50deg, #a23cff 100deg, #5b4bff 150deg, #1f9bff 190deg, #12c7c7 220deg, #22c93a 255deg, #c8d400 285deg, #ffb400 315deg, #ff8a1f 345deg, #ff6a3d 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  }
  .logo-fallback svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .notice {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px 28px;
    box-shadow: 0 10px 40px rgba(20, 32, 77, .08);
    overflow: hidden;
  }
  .notice::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent4));
  }
  .notice h1 {
    font-size: 1.35rem;
    color: var(--navy);
    margin-bottom: 14px;
    font-weight: 700;
  }
  .notice h1 .tag {
    display: inline-block;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    color: #fff;
    font-size: .85rem;
    padding: 2px 12px;
    border-radius: 999px;
    margin-inline-start: 6px;
    vertical-align: middle;
  }
  .notice p {
    font-size: 1.08rem;
    line-height: 2;
    color: var(--text);
  }
  .notice p b { color: var(--navy); }
  footer {
    margin-top: 22px;
    font-size: .9rem;
    color: var(--muted);
    direction: ltr;
    letter-spacing: .5px;
  }
  .author {
    margin-top: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--navy);
  }
  @media (max-width: 480px) {
    .notice { padding: 28px 18px 22px; }
    .notice p { font-size: 1rem; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.png" alt="CodingCreate - Code. Create. Inspire."
         onerror="this.style.display='none'; document.getElementById('fb').style.display='block';">
    <div class="logo-fallback" id="fb" role="img" aria-label="CodingCreate - Code. Create. Inspire.">
      <div class="ring"></div>
      <svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff7a2f"/>
            <stop offset=".35" stop-color="#ff2d87"/>
            <stop offset=".7" stop-color="#8a3cff"/>
            <stop offset="1" stop-color="#3b82ff"/>
          </linearGradient>
          <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8a3cff"/>
            <stop offset="1" stop-color="#ff2d87"/>
          </linearGradient>
          <linearGradient id="gS" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff2d87"/>
            <stop offset="1" stop-color="#ff9f1c"/>
          </linearGradient>
          <linearGradient id="gSp" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3b82ff"/>
            <stop offset="1" stop-color="#a23cff"/>
          </linearGradient>
        </defs>
        <!-- speed lines -->
        <g stroke-linecap="round" stroke-width="10" fill="none">
          <line x1="212" y1="206" x2="242" y2="206" stroke="#ff7a2f"/>
          <line x1="186" y1="206" x2="192" y2="206" stroke="#ff7a2f"/>
          <line x1="160" y1="238" x2="166" y2="238" stroke="#ff2d87"/>
          <line x1="186" y1="238" x2="250" y2="238" stroke="url(#gB)"/>
          <line x1="150" y1="272" x2="252" y2="272" stroke="url(#gSp)"/>
          <line x1="180" y1="306" x2="186" y2="306" stroke="#3b82ff"/>
          <line x1="204" y1="306" x2="244" y2="306" stroke="#4a63ff"/>
        </g>
        <!-- C -->
        <path d="M425 180 A103 103 0 1 0 425 322" fill="none" stroke="url(#gC)" stroke-width="24" stroke-linecap="round"/>
        <!-- code brackets -->
        <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="332,224 298,254 332,286" stroke="#8a3cff"/>
          <line x1="372" y1="212" x2="348" y2="298" stroke="#ff4d5e"/>
          <polyline points="388,224 422,254 388,286" stroke="url(#gB)"/>
        </g>
        <!-- wordmark -->
        <text x="320" y="440" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="68">
          <tspan fill="#14204d">Coding</tspan><tspan fill="url(#gS)">Create</tspan>
        </text>
        <!-- tagline -->
        <line x1="128" y1="481" x2="166" y2="481" stroke="#1f8fff" stroke-width="3"/>
        <line x1="476" y1="481" x2="526" y2="481" stroke="#ff9f1c" stroke-width="3"/>
        <text x="320" y="489" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="23" letter-spacing="2">
          <tspan fill="#1f8fff">CODE.</tspan> <tspan fill="#ff2d87">CREATE.</tspan> <tspan fill="#ff9f1c">INSPIRE.</tspan>
        </text>
      </svg>
    </div>

    <section class="notice">
      <h1>تنويه <span class="tag">مادة الاحتمالات (Probability)</span></h1>
      <p>
        نظراً لطبيعة المادة العملية والتطبيقية التي تعتمد بشكل أساسي على
        <b>الفهم وحل المسائل</b>، لا يتوفر لها محتوى (ماتريال).
      </p>
    </section>

    <footer>
      CODE. CREATE. INSPIRE.
      <div class="author">mahmoud mohamed</div>
    </footer>
  </main>
</body>
</html>
